services:
  backend:
    build: ./referral-hub-backend
    container_name: hospital-backend
    ports:
      - "8000:8000"
    env_file:
      - ./referral-hub-backend/.env
    environment:
      - NODE_ENV=docker
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node server.js"
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: referral_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./referral-hub-frontend
      args:
        # Pass the URLs here so the Materio build script can bake them into the JavaScript files!
        - NEXT_PUBLIC_SERVER_API_URL=http://backend:8000
        - NEXT_PUBLIC_CLIENT_API_URL=http://localhost:8000
        - NEXT_PUBLIC_DOCS_URL=https://demos.themeselection.com/materio-mui-nextjs-admin-template/documentation
        - NEXT_PUBLIC_PRO_URL=https://demos.themeselection.com/materio-mui-nextjs-admin-template/demo-1
        - NEXT_PUBLIC_REPO_NAME=materio-mui-nextjs-admin-template-free
    container_name: hospital-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
